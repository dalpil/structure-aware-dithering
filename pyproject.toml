[project]
name = "dither"
version = "0.1.0"
description = "Modern bi-level, digital halftoning algorithms in Python"
authors = [
    {name = "dalpil", email = "47555+dalpil@users.noreply.github.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "click>=8.5.0",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
]

[project.scripts]
dither = "dither:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
