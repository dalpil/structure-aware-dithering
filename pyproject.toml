[project]
name = "dither"
version = "0.1.0"
description = "Modern bi-level, digital halftoning algorithms in Python"
authors = [
    {name = "dalpil", email = "47555+dalpil@users.noreply.github.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "click>=8.3.2",
    "numba>=0.65.0",
    "numpy>=2.4.0",
    "pillow>=12.2.0",
    "scikit-image>=0.26",
]

[project.scripts]
dither = "dither:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
